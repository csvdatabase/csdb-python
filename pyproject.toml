[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvdatabase-csdb"
version = "0.1.0"
description = "Native Python implementation of CSDB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "CSDB contributors" }]
keywords = ["csdb", "csv", "database"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
Homepage = "https://csvdatabase.net/"
Documentation = "https://docs.csvdatabase.net/"
Repository = "https://github.com/csvdatabase/csdb-python"

[tool.setuptools.packages.find]
where = ["src"]
