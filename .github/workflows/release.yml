name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish PyPI package
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          target = os.environ.get('TARGET_COMMITISH', '')
          match = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', tag)
          if not match:
              raise SystemExit(f'release tag must look like v1.1.1, received {tag}')
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          if tag != f'v{version}':
              raise SystemExit(f'release tag {tag} does not match pyproject version {version}')
          if match.group(2) == '0' and match.group(3) == '0' and target != f'v{match.group(1)}':
              raise SystemExit(f'major release {tag} must target branch v{match.group(1)}, received {target}')
          PY
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
